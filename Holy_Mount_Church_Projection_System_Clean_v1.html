let current=0, slide=0, blanked=false, showRoman=true, output=null;
let channel=null;
try{channel=new BroadcastChannel(CHANNEL_NAME)}catch(e){channel=null}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function loadSongs(){
  try{
    const raw=localStorage.getItem(SONG_KEY);
    if(raw){const a=JSON.parse(raw);if(Array.isArray(a)&&a.length)songs=a}
  }catch(e){}
}
function saveSongs(){try{localStorage.setItem(SONG_KEY,JSON.stringify(songs))}catch(e){}}

function state(){return {type:"state",song:current,slide,blanked,showRoman,songs,stamp:Date.now()}}
function send(){
  const d=state();
  try{localStorage.setItem(STATE_KEY,JSON.stringify(d))}catch(e){}
  if(channel)try{channel.postMessage(d)}catch(e){}
  if(output&&!output.closed)try{output.postMessage(d,location.origin)}catch(e){}
  updateStatus();
}
function updateStatus(){
  const el=document.getElementById("status");
  if(el)el.textContent=(output&&!output.closed)?"● TV Output open":"TV Output not open";
}

function renderSongs(){
  const q=(document.getElementById("search")?.value||"").toLowerCase();
  const arr=songs.map((s,i)=>({s,i})).filter(x=>(x.s.title+" "+(x.s.transliteration||"")).toLowerCase().includes(q));
  document.getElementById("songCount").textContent=arr.length;
  document.getElementById("songList").innerHTML=arr.map(x=>`
    <button class="song ${x.i===current?"active":""}" onclick="selectSong(${x.i})">
      <span class="n">${x.i+1}</span><span class="ta">${esc(x.s.title)}</span>
      <div class="en">${esc(x.s.transliteration||"")}</div>
    </button>`).join("");
}
function selectSong(i){current=i;slide=0;blanked=false;renderSongs();render();send()}
function render(){
  const s=songs[current]||{title:"",transliteration:"",stanzas:[]};
  document.getElementById("currentTitle").textContent=s.title;
  document.getElementById("slides").innerHTML=(s.stanzas||[]).map((st,i)=>`
    <div class="slide ${i===slide?"active":""}" onclick="go(${i})">
      <div class="slidehead">SLIDE ${i+1}</div>
      ${st.map(p=>`<div class="ta">${esc(p[0])}</div>${showRoman&&p[1]?`<div class="rom">${esc(p[1])}</div>`:""}`).join("")}
    </div>`).join("") || `<div style="color:#7f8998;padding:20px">No lyrics yet. Use Add Song or Edit Song.</div>`;
  document.getElementById("slideCount").textContent=(s.stanzas?.length?`${slide+1} / ${s.stanzas.length}`:"0 / 0");
  document.getElementById("preview").innerHTML=blanked?"":slideHTML(s,slide);
  document.getElementById("romanBtn").textContent=showRoman?"தமிழ் + Romanized":"தமிழ் only";
}
function slideHTML(s,i){
  const st=s.stanzas?.[i]||[];
  return `<div class="screenTa">${st.map(p=>esc(p[0])).join("<br>")}
    ${showRoman?`<div class="screenRom">${st.map(p=>esc(p[1]||"")).join("<br>")}</div>`:""}</div>`;
}
function go(i){slide=i;blanked=false;render();send()}
function next(){const n=songs[current]?.stanzas?.length||0;if(n){slide=Math.min(n-1,slide+1);blanked=false;render();send()}}
function prev(){const n=songs[current]?.stanzas?.length||0;if(n){slide=Math.max(0,slide-1);blanked=false;render();send()}}
function blank(){blanked=!blanked;render();send()}
function toggleRoman(){showRoman=!showRoman;render();send()}

function parseLyrics(raw){
  return raw.trim().split(/\n\s*\n/).map(block=>block.split(/\n/).map(line=>{
    const parts=line.split("|");
    return [parts[0].trim(),parts.slice(1).join("|").trim()];
  }).filter(x=>x[0])).filter(x=>x.length);
}
function lyricsToText(stanzas){
  return (stanzas||[]).map(st=>st.map(p=>p[0]+(p[1]?" | "+p[1]:"")).join("\n")).join("\n\n");
}
function openSongForm(mode){
  const s=songs[current]||{title:"",transliteration:"",stanzas:[]};
  document.getElementById("modalTitle").textContent=mode==="edit"?"Edit Song":"Add Song";
  document.getElementById("editIndex").value=mode==="edit"?current:"";
  document.getElementById("newTitle").value=mode==="edit"?s.title:"";
  document.getElementById("newRoman").value=mode==="edit"?(s.transliteration||""):"";
  document.getElementById("newLyrics").value=mode==="edit"?lyricsToText(s.stanzas):"";
  document.getElementById("songModal").classList.remove("hidden");
  setTimeout(()=>document.getElementById("newTitle").focus(),50);
}
function closeSongForm(){document.getElementById("songModal").classList.add("hidden")}
function saveSongFromForm(){
  const title=document.getElementById("newTitle").value.trim();
  const roman=document.getElementById("newRoman").value.trim();
  const raw=document.getElementById("newLyrics").value.trim();
  if(!title||!raw){alert("Please enter the song title and lyrics.");return}
  const stanzas=parseLyrics(raw);
  if(!stanzas.length){alert("Please enter at least one lyric slide.");return}
  const idx=document.getElementById("editIndex").value;
  const item={title,transliteration:roman,stanzas};
  if(idx===""){songs.push(item);current=songs.length-1}
  else{songs[Number(idx)]=item}
  slide=0;blanked=false;saveSongs();renderSongs();render();send();closeSongForm();
}
function deleteCurrentSong(){
  if(songs.length<=1){alert("Keep at least one song.");return}
  if(!confirm("Delete this song?"))return;
  songs.splice(current,1);current=Math.min(current,songs.length-1);slide=0;blanked=false;
  saveSongs();renderSongs();render();send();
}

function openOutput(){
  const url=location.href.split("#")[0]+"#output";
  if(output&&!output.closed){output.focus();send();return}
  output=window.open(url,"HolyMountChurchTV","width=1280,height=720,resizable=yes,scrollbars=no");
  if(!output){
    alert("Chrome blocked the TV Output window. Allow pop-ups for this site, then press Open TV Output again.");
    updateStatus();return;
  }
  updateStatus();
  setTimeout(()=>{send();try{output.focus()}catch(e){}},300);
  setTimeout(send,1000);
}
function isOutput(){return location.hash==="#output"}

function outputPage(){
  document.documentElement.style.overflow="hidden";
  document.body.innerHTML=`<div id="tv" style="width:100vw;height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw">
    <div id="out" style="font-family:Arial,'Noto Sans Tamil',sans-serif;width:100%;font-weight:800"></div></div>`;
  document.title="Holy Mount Church — TV Output";
  function apply(d){
    if(!d||d.type!=="state")return;
    if(Array.isArray(d.songs)&&d.songs.length)songs=d.songs;
    showRoman=d.showRoman!==false;
    const s=songs[d.song]; const out=document.getElementById("out"); if(!out||!s)return;
    if(d.blanked){out.innerHTML="";return}
    out.innerHTML=slideHTML(s,d.slide);
  }
  function poll(){
    try{
      const raw=localStorage.getItem(STATE_KEY);
      if(raw)apply(JSON.parse(raw));
    }catch(e){}
  }
  if(channel)channel.onmessage=e=>{if(e.data?.type==="request"){try{channel.postMessage(state())}catch(err){}}else apply(e.data)};
  window.addEventListener("message",e=>{if(e.origin===location.origin)apply(e.data)});
  poll();setInterval(poll,150);
  if(channel)try{channel.postMessage({type:"request"})}catch(e){}
}
window.addEventListener("storage",e=>{if(e.key===STATE_KEY&&e.newValue&&isOutput()){try{window.__apply?.(JSON.parse(e.newValue))}catch(err){}}});
window.addEventListener("beforeunload",()=>{if(!isOutput()&&output&&!output.closed)try{output.close()}catch(e){}});

if(isOutput())outputPage();
else{
  loadSongs();
  if(!localStorage.getItem(SONG_KEY))saveSongs();
  document.getElementById("search").addEventListener("input",renderSongs);
  if(channel)channel.onmessage=e=>{if(e.data?.type==="request")send()};
  window.addEventListener("focus",updateStatus);
  renderSongs();selectSong(0);updateStatus();
}
document.addEventListener("keydown",e=>{
  if(isOutput())return;
  if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev(); else if(e.key.toLowerCase()==="b")blank();
});
</script></body></html>
