function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 const q=(document.getElementById('search').value||'').toLowerCase().trim();
 const filtered=songs.filter(s=>(s.title+' '+s.roman+' '+s.ta+' '+s.ro).toLowerCase().includes(q));
 document.getElementById('list').innerHTML=filtered.length?filtered.map((s,i)=>`
  <article class="song">
   <h2 class="title">${esc(s.title)}</h2>
   <div class="roman">${esc(s.roman)}</div>
   <div class="lyrics">${s.ta.split('\n').map(x=>x?'<div class="line">'+esc(x)+'</div>':'<div class="spacer"></div>').join('')}</div>
   <div class="lyrics">${s.ro.split('\n').map(x=>x?'<div class="line">'+esc(x)+'</div>':'<div class="spacer"></div>').join('')}</div>
  </article>`).join(''):'<div class="empty">No songs found.</div>';
}
function toggleSearch(){
 const e=document.getElementById('search');
 e.classList.toggle('hidden');
 if(!e.classList.contains('hidden')){e.focus();window.scrollTo({top:0,behavior:'smooth'})}
}
render();
</script>
