<script>
let songs=[{"title":"நீர் என் பெலனும் என் கேடகமாம்","transliteration":"Neer En Pelanum En Kaedakamaam","stanzas":[[["நீர் என் பெலனும் என் கேடகமாம்","Neer en pelanum en kaedakamaam"],["உம்மைத்தான் நம்பி இருந்தேன்","Ummaiththaan nampi irunthaen (2)"],["சகாயம் பெற்றேன் உதவி பெற்றேன்","Sakaayam petten uthavi petten"],["பாடி உம்மை துதிப்பேன்","Paati ummai thuthippaen (2)"]],[["உம்மை போற்றுவேன் உம்மை உயர்த்துவேன்","Ummai potruvaen Ummai uyarththuvaen"],["உம்மை பாடுவேன் உம்மை ஆராதிப்பேன்","Ummai paaduvaen ummai aaraathippaen (2)"],["துதிகனமகிமைக்கு பாத்திரர்","Thuthikanamakimaikku paaththirar"],["இயேசு ராஜா நீரே","Yesu raajaa neerae (2)"]],[["என் விண்ணபத்தின் சத்தத்தை கேட்டவரே","En vinnappaththin saththaththai kaettavarae"],["நன்றி நன்றி ஐயா","Nanti nanti aiyaa (2)"],["விடுவித்து என்னை மீட்டவரே","Viduviththu ennai meettavarae"],["நன்றி நன்றி ஐயா","Nanti nanti aiyaa (2)"]],[["என்னை இரட்சித்து ஆசீர்வதித்தவரே","Ennai iratchiththu aaseervathiththavarae"],["நன்றி நன்றி ஐயா","Nanti nanti aiyaa (2)"],["போசித்து என்னை உயர்தினீரே","Posiththu ennai uyarthineerae"],["நன்றி நன்றி ஐயா","Nanti nanti aiyaa (2)"]]]},{"title":"புது கிருபைகள் தினம் தினம் தந்து","transliteration":"Puthu Kirupaikal Thinam Thinam Thanthu","stanzas":[[["புது கிருபைகள் தினம் தினம் தந்து","puthu Kirupaikal Thinam Thinam Thanthu"],["என்னை நடத்தி செல்பவரே","ennai Nadaththi Selpavarae"],["அனுதினமும் உம் கரம் நீட்டி","Anuthinamum Um Karam Neetti"],["என்னை ஆசீர்வதிப்பவரே","Ennai Aaseervathippavarae"]],[["என் இயேசுவே உம்மை சொந்தமாக","en Yesuvae Ummai Sonthamaaka"],["கொண்ட என் பாக்கியமே","Konnda En Paakkiyamae"],["இதை விடவும் பெரியதான","Ithai Vidavum Periyathaana"],["மேன்மை ஒன்றும் இல்லையே","Maenmai Ontum Illaiyae"]],[["நேர் வழியாய் என்னை நடத்தினீர்","naer Valiyaay Ennai Nadaththineer"],["நீதியின் பாதையில் நடத்தினீர்","Neethiyin Paathaiyil Nadaththineer"],["காரியம் வாய்க்க செய்தீர்","Kaariyam Vaaykka Seytheer"],["என்னை கண்மணி போல காத்திட்டீர்","Ennai Kannmanni Pola Kaaththittir"]],[["பாதங்கள் சறுக்கின வேளையில்","paathan ை நடத்தி குறைவின்றி காத்து","ithuvarai Nadaththi Kuraivinti Kaaththu"],["மகிழ்வை தந்தீரே நன்றி ஐயா","makilvai Thantheerae Nanti Aiyaa"],["தண்ணீரை கடந்தேன் சோதனை ஜெயித்தேன்","thannnneerai Kadanthaen Sothanai Jeyiththaen"],["மதிலை தாண்டினேன் உம் பலத்தால்","Mathilai Thaanntinaen Um Palaththaal"]],[["நன்றி நன்றி ஐயா","nanti Nanti Aiyaa"],["உம்மை உயர்த்திடுவேன்","Ummai Uyarththiduvaen"]],[["ஆபத்து நாளில் அனுகுலமான","aapaththu Naalil Anukulamaana"],["துணையுமானீரே நன்றி ஐயா","Thunnaiyumaaneerae Nanti Aiyaa"],["உம் கரம் நீட்டி ஆசீர்வதித்து","um Karam Neetti Aaseervathiththu"],["எல்லையை பெருக்கினீர் நன்றி ஐயா","Ellaiyai Perukkineer Nanti Aiyaa"]],[["அபிஷேகம் தந்து வரங்களை ஈந்து","apishaekam Thanthu Varangalai Eenthu"],["பயண்படச் செய்தீரே நன்றி ஐயா","Payannpadach Seytheerae Nanti Aiyaa"],["கிருபைகள் தந்து ஊழியம் தந்து","kirupaikal Thanthu Ooliyam Thanthu"],["உயர்த்தி வைத்தீரே நன்றி ஐயா","Uyarththi Vaiththeerae Nanti Aiyaa"]]]}];
let current=0,slide=0,showRoman=true,blanked=false,output=null;
let tvStyle={font:"'Noto Sans Tamil',Arial,sans-serif",size:42,weight:700,line:1.5,align:'center',bg:'#000',color:'#fff',romSize:.38};
const channel='BroadcastChannel' in window?new BroadcastChannel('holy-mount-live'):null;
function init(){loadLocal();renderSongs();selectSong(Math.min(current,songs.length-1));document.getElementById('search').oninput=renderSongs;if(channel)channel.onmessage=e=>{if(e.data?.type==='request')send();};}
function loadLocal(){try{const raw=localStorage.getItem('hmc_songs');if(raw){const x=JSON.parse(raw);if(Array.isArray(x)&&x.length)songs=x;}const st=localStorage.getItem('hmc_style');if(st)tvStyle={...tvStyle,...JSON.parse(st)};}catch(e){}}
function saveLocal(){try{localStorage.setItem('hmc_songs',JSON.stringify(songs));localStorage.setItem('hmc_style',JSON.stringify(tvStyle));}catch(e){}}
function renderSongs(){const q=document.getElementById('search').value.toLowerCase();const arr=songs.map((s,i)=>({s,i})).filter(x=>(x.s.title+' '+(x.s.transliteration||'')).toLowerCase().includes(q));document.getElementById('songCount').textContent='('+arr.length+')';document.getElementById('songList').innerHTML=arr.map(x=>`<button class="song ${x.i===current?'active':''}" onclick="selectSong(${x.i})"><span class="n">${x.i+1}</span><div class="ta">${esc(x.s.title)}</div><div class="en">${esc(x.s.transliteration||'')}</div></button>`).join('')}
function selectSong(i){current=i;slide=0;blanked=false;renderSongs();render();send()}
function render(){const s=songs[current];if(!s)return;document.getElementById('songTitle').textContent=s.title;document.getElementById('songRoman').textContent=s.transliteration||'';document.getElementById('slides').innerHTML=(s.stanzas||[]).map((st,i)=>`<div class="slide ${i===slide?'active':''}" onclick="go(${i})"><div class="slidehead">Slide ${i+1}</div>${st.map(p=>`<div class="ta">${esc(p[0])}</div>${showRoman?`<div class="rom">${esc(p[1]||'')}</div>`:''}`).join('')}</div>`).join('');document.getElementById('count').textContent=(s.stanzas?.length?`${slide+1} / ${s.stanzas.length}`:'—');document.getElementById('preview').innerHTML=blanked?'':slideHTML(s,slide,true);applyPreviewStyle()}
function slideHTML(s,i,preview=false){const st=s.stanzas[i]||[];return `<div class="screenTa">${st.map(p=>esc(p[0])).join('<br>')}${showRoman?`<div class="screenRom">${st.map(p=>esc(p[1]||'')).join('<br>')}</div>`:''}</div>`}
function go(i){slide=i;blanked=false;render();send()}function next(){const n=songs[current].stanzas?.length||0;if(n){slide=Math.min(n-1,slide+1);blanked=false;render();send()}}function prev(){if((songs[current].stanzas?.length||0)>0){slide=Math.max(0,slide-1);blanked=false;render();send()}}function blank(){blanked=!blanked;render();send()}
function toggleRoman(){showRoman=!showRoman;document.getElementById('romanBtn').textContent=showRoman?'தமிழ் + English':'தமிழ் only';render();send()}
function state(){return {type:'state',song:current,slide,blanked,showRoman,style:tvStyle,t:Date.now()}}
function send(){const d=state();if(channel)channel.postMessage(d);try{localStorage.setItem('hmc_live_state',JSON.stringify(d))}catch(e){}if(output&&!output.closed){try{output.postMessage(d,location.origin)}catch(e){}}document.getElementById('status').textContent=output&&!output.closed?'TV output connected':'TV output not opened'}
function openOutput(){if(output&&!output.closed){output.focus();send();return}output=window.open(location.href.split('#')[0]+'#output','HolyMountTV','popup=yes,width=1280,height=720');if(!output){alert('Please allow popups for this site.');return}setTimeout(send,300);setTimeout(send,900)}
function isOutput(){return location.hash==='#output'}
function outputPage(){document.body.innerHTML=`<div id="outputRoot" style="width:100vw;height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 7vw;overflow:hidden"><div id="out" style="width:100%"></div></div>`;document.title='Holy Mount Church — TV Output';if(channel)channel.onmessage=e=>apply(e.data);window.addEventListener('message',e=>apply(e.data));let last=0;function poll(){try{const raw=localStorage.getItem('hmc_live_state');if(raw){const d=JSON.parse(raw);if(d.t&&d.t>last){last=d.t;apply(d)}}}catch(e){}}setInterval(poll,100);poll();if(channel)channel.postMessage({type:'request'});setTimeout(()=>{if(channel)channel.postMessage({type:'request'})},300)}
function apply(d){if(!d||d.type!=='state')return;const s=songs[d.song];const out=document.getElementById('out');const root=document.getElementById('outputRoot');if(!out||!root||!s)return;const st=d.style||tvStyle;root.style.background=st.bg||'#000';root.style.color=st.color||'#fff';out.style.fontFamily=st.font||"'Noto Sans Tamil',Arial,sans-serif";out.style.fontSize=(st.size||42)+'px';out.style.fontWeight=st.weight||700;out.style.lineHeight=st.line||1.5;out.style.textAlign=st.align||'center';if(d.blanked){out.innerHTML='';return}out.innerHTML=slideHTML(s,d.slide)}
function applyPreviewStyle(){const sc=document.getElementById('previewScreen');if(!sc)return;sc.style.background=tvStyle.bg||'#000';sc.style.color=tvStyle.color||'#fff';document.documentElement.style.setProperty('--tvfont',tvStyle.font);document.documentElement.style.setProperty('--tvsize',(Math.max(12,tvStyle.size*.58))+'px');document.documentElement.style.setProperty('--tvweight',tvStyle.weight);document.documentElement.style.setProperty('--tvline',tvStyle.line);document.documentElement.style.setProperty('--tvalign',tvStyle.align)}
function addSong(){openSongModal(-1)}function editSong(){if(!songs[current])return;openSongModal(current)}
function openSongModal(idx){const s=idx<0?{title:'',transliteration:'',stanzas:[[ ['', '' ]]]}:songs[idx];const blocks=(s.stanzas||[]).map(st=>st.map(p=>`${p[0]||''} || ${p[1]||''}`).join('\n')).join('\n\n');document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="dialog"><h2>${idx<0?'Add Song':'Edit Song'}</h2><div class="field"><label>Song title (Tamil)</label><input id="mTitle" value="${attr(s.title)}"></div><div class="field"><label>Romanized title</label><input id="mRoman" value="${attr(s.transliteration||'')}"></div><div class="field"><label>Lyrics — one line per row: <b>Tamil || Romanized</b> &nbsp; • &nbsp; blank line = new slide</label><textarea id="mLyrics" placeholder="நீர் என் பெலனும் என் கேடகமாம் || Neer en pelanum en kaedakamaam
உம்மைத்தான் நம்பி இருந்தேன் || Ummaiththaan nampi irunthaen

அடுத்த வரி || Adutha vari">${esc(blocks)}</textarea><div class="smallnote">You can add as many slides and lines as you need.</div></div><div class="modalActions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSong(${idx})">💾 Save Song</button></div></div></div>`}
function saveSong(idx){const title=document.getElementById('mTitle').value.trim();if(!title){alert('Please enter the song title.');return}const roman=document.getElementById('mRoman').value.trim();const raw=document.getElementById('mLyrics').value.replace(/\r/g,'').trim();const stanzas=raw?raw.split(/\n\s*\n/).map(block=>block.split('\n').map(line=>{const parts=line.split('||');return[(parts[0]||'').trim(),(parts.slice(1).join('||')||'').trim()]}).filter(p=>p[0])):[];const song={title,transliteration:roman,stanzas};if(idx<0){songs.push(song);current=songs.length-1}else songs[idx]=song;slide=0;blanked=false;saveLocal();closeModal();renderSongs();render();send()}
function deleteSong(){if(!songs[current])return;if(!confirm('Delete this song?'))return;songs.splice(current,1);if(!songs.length){songs=[{title:'New Song',transliteration:'',stanzas:[]}]}current=Math.min(current,songs.length-1);slide=0;saveLocal();renderSongs();render();send()}
function openStyle(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="dialog"><h2>🎨 TV Font & Style</h2><div class="row"><div class="field"><label>Font</label><select id="sFont"><option value="'Noto Sans Tamil',Arial,sans-serif">Noto Sans Tamil</option><option value="Latha,Arial,sans-serif">Latha</option><option value="Vijaya,Arial,sans-serif">Vijaya</option><option value="Arial,sans-serif">Arial</option><option value="Georgia,serif">Georgia</option></select></div><div class="field"><label>Text size</label><input id="sSize" type="number" min="24" max="110" value="${tvStyle.size}"></div></div><div class="row"><div class="field"><label>Text alignment</label><select id="sAlign"><option>center</option><option>left</option><option>right</option></select></div><div class="field"><label>Text weight</label><select id="sWeight"><option value="400">Normal</option><option value="600">Semi Bold</option><option value="700">Bold</option><option value="800">Extra Bold</option></select></div></div><div class="row"><div class="field"><label>Line spacing</label><select id="sLine"><option value="1.25">Tight</option><option value="1.5">Normal</option><option value="1.75">Wide</option><option value="2">Extra Wide</option></select></div><div class="field"><label>TV background</label><select id="sBg"><option value="#000">Black</option><option value="#07111f">Deep Blue</option><option value="#15100a">Warm Dark</option><option value="linear-gradient(135deg,#050505,#18243a)">Blue Gradient</option></select></div></div><div class="field"><label>TV text color</label><select id="sColor"><option value="#fff">White</option><option value="#f5e8b0">Soft Gold</option><option value="#dbeafe">Soft Blue</option></select></div><div class="stylebox"><h3>Recommended for projector</h3><div class="checks">Large Tamil • High contrast • Centered • Dark background</div></div><div class="modalActions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStyle()">💾 Apply Style</button></div></div></div>`;document.getElementById('sFont').value=tvStyle.font;document.getElementById('sAlign').value=tvStyle.align;document.getElementById('sWeight').value=String(tvStyle.weight);document.getElementById('sLine').value=String(tvStyle.line);document.getElementById('sBg').value=tvStyle.bg;document.getElementById('sColor').value=tvStyle.color}
function saveStyle(){tvStyle={font:document.getElementById('sFont').value,size:Math.max(24,Math.min(110,Number(document.getElementById('sSize').value)||42)),weight:Number(document.getElementById('sWeight').value),line:Number(document.getElementById('sLine').value),align:document.getElementById('sAlign').value,bg:document.getElementById('sBg').value,color:document.getElementById('sColor').value,romSize:.38};saveLocal();closeModal();applyPreviewStyle();render();send()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function attr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.addEventListener('keydown',e=>{if(isOutput())return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key.toLowerCase()==='b')blank();else if(e.key==='Escape')closeModal()});
if(isOutput())outputPage();else init();
</script></body></html>
